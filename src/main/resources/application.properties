spring.application.name=Retail Management System

# Defaults match docker-compose.yml. Override with environment variables in any other setup.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/retail_management_system?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:retail}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/reviews}
